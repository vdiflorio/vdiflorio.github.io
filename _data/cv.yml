          - "Thesis: Mathematical, Algorithmic and Numerical Solutions to Enhance Electrostatic Calculations for Biomolecules in Electrolytic Solutions"
          - "Supervisors: Dr. Walter Rocchia, Prof. Lamberto Rondoni"

