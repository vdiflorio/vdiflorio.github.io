    Professional Summary:
      - bullet: >
          A physicist driven by the challenge of bridging **theoretical models** and **computational innovation**.
          My work lies at the intersection of physics, computation, and applied mathematics, with a focus on
          developing solvers and models for complex physical systems — from biomolecular electrostatics to
          non-equilibrium thermodynamics.

